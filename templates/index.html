<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>现代情感分析系统 | BiLSTM+Attention</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f7fc 0%, #eef2f7 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 2rem 1.5rem;
            color: #1e293b;
        }

        /* 主容器 */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(120deg, #1e293b, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .header p {
            color: #5b6e8c;
            margin-top: 0.5rem;
            font-weight: 500;
        }
        .badge {
            display: inline-block;
            background: rgba(59,130,246,0.1);
            backdrop-filter: blur(4px);
            padding: 0.25rem 0.75rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #3b82f6;
            font-weight: 500;
            margin-top: 0.75rem;
        }

        /* 双栏布局 */
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
        }
        .panel {
            flex: 1;
            min-width: 280px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
            padding: 1.8rem;
            border: 1px solid rgba(255,255,255,0.6);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .panel:hover {
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        .panel-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-left: 4px solid #3b82f6;
            padding-left: 0.8rem;
        }

        /* 输入区 */
        textarea {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            font-size: 0.95rem;
            font-family: inherit;
            background: white;
            transition: 0.2s;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .btn-group {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        button {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 0.6rem 1.4rem;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            backdrop-filter: blur(2px);
        }
        .btn-primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
            box-shadow: 0 2px 6px rgba(59,130,246,0.3);
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: scale(0.98);
        }
        .btn-outline {
            background: rgba(255,255,255,0.8);
            border-color: #cbd5e1;
        }
        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .btn-clear {
            background: rgba(255,255,255,0.8);
            border-color: #fecaca;
            color: #dc2626;
        }
        .btn-clear:hover {
            background: #fee2e2;
            border-color: #f87171;
        }

        /* 结果卡片 */
        .result-card {
            background: rgba(255,255,255,0.9);
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-top: 1.2rem;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .sentiment {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .confidence-label {
            font-size: 0.8rem;
            color: #5b6e8c;
            margin-top: 0.5rem;
        }
        .confidence-bar {
            background: #e2e8f0;
            border-radius: 40px;
            height: 10px;
            width: 100%;
            margin: 0.8rem 0;
            overflow: hidden;
        }
        .confidence-fill {
            background: #3b82f6;
            width: 0%;
            height: 100%;
            border-radius: 40px;
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .confidence-value {
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* 记录列表 */
        .record-list {
            margin-top: 1.5rem;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .record-item {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            border-radius: 1rem;
            padding: 0.7rem 1rem;
            margin-bottom: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            transition: 0.1s;
        }
        .record-text {
            font-size: 0.85rem;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .record-label {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 40px;
            background: #e2e8f0;
            min-width: 52px;
            text-align: center;
        }
        .positive-bg { background: #dcfce7; color: #15803d; }
        .negative-bg { background: #fee2e2; color: #b91c1c; }
        .record-time {
            font-size: 0.7rem;
            color: #6c7a91;
        }

        /* 批量预测区域 */
        .batch-area {
            margin-top: 1.5rem;
            background: rgba(255,255,255,0.5);
            border-radius: 1.5rem;
            padding: 1.2rem;
        }
        input[type="file"] {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            width: 100%;
            max-width: 280px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.8rem;
            background: white;
            border-radius: 1rem;
            overflow: hidden;
        }
        th, td {
            padding: 0.6rem 0.8rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background: #f8fafc;
            font-weight: 600;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }

        @media (max-width: 760px) {
            body { padding: 1rem; }
            .panel { padding: 1.2rem; }
            .record-text { white-space: normal; max-width: 180px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>✨ 情感分析 · 灵眸</h1>
        <p>基于 BiLSTM + Attention 的中文情感引擎 | 准确率 87.5%</p>
        <div class="badge">⚡ 实时预测 · 批量分析 · 置信度可视</div>
    </div>

    <div class="dashboard">
        <!-- 左侧：单条预测 -->
        <div class="panel">
            <div class="panel-title">
                <span>📝 单条分析</span>
            </div>
            <textarea id="inputText" rows="3" placeholder="输入中文评论，例如：酒店的隔音一般但服务不错..."></textarea>
            <div class="btn-group">
                <button id="predictBtn" class="btn-primary">🔍 分析情感</button>
                <button id="clearRecordsBtn" class="btn-clear">🗑️ 清空记录</button>
            </div>

            <div id="singleResult" class="result-card" style="display: none;">
                <div class="sentiment" id="sentimentText">--</div>
                <div class="confidence-label">模型置信度</div>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="confidenceFill"></div>
                </div>
                <div class="confidence-value" id="confidencePercent">0%</div>
            </div>

            <div class="record-list">
                <div style="font-weight: 600; margin-bottom: 0.8rem;">📋 最近预测记录</div>
                <div id="recordContainer"></div>
            </div>
        </div>

        <!-- 右侧：批量预测 -->
        <div class="panel">
            <div class="panel-title">
                <span>📁 批量预测</span>
            </div>
            <p style="font-size: 0.8rem; color: #5b6e8c;">上传 CSV（包含 <code>text</code> 列）</p>
            <input type="file" id="batchFile" accept=".csv">
            <div class="btn-group" style="margin-top: 1rem;">
                <button id="batchBtn" class="btn-primary">🚀 开始批量预测</button>
            </div>
            <div id="batchProgress" style="display:none; margin-top: 1rem; color: #3b82f6; font-size: 0.8rem;">⏳ 分析中，请稍候...</div>
            <div id="batchResult" style="margin-top: 1rem;"></div>
        </div>
    </div>
</div>

<script>
    // ----- DOM 元素 -----
    const predictBtn = document.getElementById('predictBtn');
    const inputText = document.getElementById('inputText');
    const singleResultDiv = document.getElementById('singleResult');
    const sentimentText = document.getElementById('sentimentText');
    const confidenceFill = document.getElementById('confidenceFill');
    const confidencePercentSpan = document.getElementById('confidencePercent');
    const recordContainer = document.getElementById('recordContainer');
    const clearRecordsBtn = document.getElementById('clearRecordsBtn');

    let records = [];

    // 辅助转义
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 渲染记录
    function renderRecords() {
        if (!recordContainer) return;
        recordContainer.innerHTML = '';
        for (let r of records) {
            const div = document.createElement('div');
            div.className = 'record-item';
            let labelClass = '';
            if (r.sentiment === '正面') labelClass = 'positive-bg';
            else if (r.sentiment === '负面') labelClass = 'negative-bg';
            else labelClass = '';
            div.innerHTML = `
                <div class="record-text" title="${escapeHtml(r.text)}">${escapeHtml(r.text)}</div>
                <div class="record-label ${labelClass}">${r.sentiment}</div>
                <div class="record-time">${r.time}</div>
            `;
            recordContainer.appendChild(div);
        }
    }

    function addRecord(text, sentiment, confidence) {
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
        records.unshift({ text, sentiment, confidence, time: timeStr });
        if (records.length > 10) records.pop();
        renderRecords();
    }

    function clearRecords() {
        records = [];
        renderRecords();
    }

    function displayResult(sentiment, confidence) {
        singleResultDiv.style.display = 'block';
        sentimentText.innerText = sentiment;
        const percent = (confidence * 100).toFixed(1);
        confidenceFill.style.width = `${percent}%`;
        confidencePercentSpan.innerText = `${percent}%`;
        // 情感颜色
        if (sentiment === '正面') {
            confidenceFill.style.background = '#10b981';
            sentimentText.style.color = '#10b981';
        } else if (sentiment === '负面') {
            confidenceFill.style.background = '#ef4444';
            sentimentText.style.color = '#ef4444';
        } else {
            confidenceFill.style.background = '#f59e0b';
            sentimentText.style.color = '#f59e0b';
        }
    }

    // 单条预测
    predictBtn.addEventListener('click', () => {
        const text = inputText.value.trim();
        if (!text) {
            alert('请输入评论文本');
            return;
        }
        fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
                return;
            }
            displayResult(data.sentiment, data.confidence);
            addRecord(text, data.sentiment, data.confidence);
        })
        .catch(err => alert('请求失败: ' + err.message));
    });

    clearRecordsBtn.addEventListener('click', clearRecords);

    // 批量预测
    const batchBtn = document.getElementById('batchBtn');
    const batchFile = document.getElementById('batchFile');
    const batchProgress = document.getElementById('batchProgress');
    const batchResultDiv = document.getElementById('batchResult');

    batchBtn.addEventListener('click', () => {
        if (!batchFile.files.length) {
            alert('请选择 CSV 文件');
            return;
        }
        const file = batchFile.files[0];
        const formData = new FormData();
        formData.append('file', file);

        batchProgress.style.display = 'block';
        batchResultDiv.innerHTML = '';

        fetch('/batch_predict', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            batchProgress.style.display = 'none';
            if (data.error) {
                batchResultDiv.innerHTML = `<p style="color:red;">错误：${escapeHtml(data.error)}</p>`;
                return;
            }
            let html = '<div style="overflow-x:auto;"><table><thead><tr><th>评论内容</th><th>情感</th><th>置信度</th></tr></thead><tbody>';
            for (let item of data.results) {
                html += `<tr>
                            <td>${escapeHtml(item.text)}</td>
                            <td>${item.sentiment}</td>
                            <td>${(item.confidence * 100).toFixed(1)}%</td>
                         </tr>`;
            }
            html += '</tbody></table></div>';
            batchResultDiv.innerHTML = html;
        })
        .catch(err => {
            batchProgress.style.display = 'none';
            batchResultDiv.innerHTML = `<p style="color:red;">请求失败: ${err.message}</p>`;
        });
    });
</script>
</body>
</html>
